<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokemon Randomizer YAO</title>
<!-- Favicon redesigned to match the new header mark (11/10/2026, style polish item 2): a small Poke-Ball ring
     instead of the old plain diamond, same red-to-violet accent gradient. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff4a3d'/%3E%3Cstop offset='1' stop-color='%238b6bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='%2306070d' stroke='url(%23g)' stroke-width='4'/%3E%3Cpath d='M5 32a27 27 0 0 1 54 0z' fill='url(%23g)'/%3E%3Crect x='5' y='29' width='54' height='6' fill='%2306070d'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%2306070d' stroke='url(%23g)' stroke-width='3'/%3E%3C/svg%3E">
<!-- Theme pass (11/10/2026, web UI feedback item 3): Chakra Petch for section labels only, JetBrains Mono
     for numeric readouts only. The body/UI face (Inter, system fallback) is unchanged. -->
<link rel="stylesheet" href="app.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="cursor-ring" aria-hidden="true"></div>
<div class="cursor-dot" aria-hidden="true"></div>

<div class="app">
  <header class="top">
    <div class="brand">
      <!-- Redesigned as a Poke-Ball-inspired mark (11/10/2026, style polish item 2): the previous diamond-plus-
           crosshair shape read as a generic tech logo with no Pokemon identity. Kept simple and crisp (a
           ring, a split top/bottom, a center band and button), leaning on the red accent directly rather than
           the old all-cyan/violet/pink treatment. -->
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4a3d"/><stop offset=".55" stop-color="#ff8a66"/><stop offset="1" stop-color="#8b6bff"/></linearGradient></defs><circle cx="32" cy="32" r="27" fill="rgba(6,7,13,.6)" stroke="url(#lg)" stroke-width="3.5"/><path d="M6 32a26 26 0 0 1 52 0z" fill="url(#lg)"/><rect x="6" y="29.4" width="52" height="5.2" fill="#06070d"/><circle cx="32" cy="32" r="8.5" fill="#06070d" stroke="url(#lg)" stroke-width="3"/><circle cx="32" cy="32" r="3.4" fill="url(#lg)"/></svg>
      <div><b>Pokemon Randomizer YAO</b><small id="version">local web interface</small></div>
    </div>
    <!-- "Extras" step removed (11/10/2026, web UI feedback item 17): every feature that used to live on its
         own Extras step now renders inside the randomizer step, in the native section it belongs to (see
         buildYaoCards() and yaoCardsForSection() in app.js), so there are only three steps now. -->
    <nav class="steps" id="steps" aria-label="Steps">
      <button data-view="game" class="active"><span class="n">1</span>Game</button>
      <button data-view="rand" disabled><span class="n">2</span>Randomizer</button>
      <button data-view="run" disabled><span class="n">3</span>Run</button>
    </nav>
    <div class="top-tools">
      <button class="icon-btn" id="themeBtn" title="Light or dark" aria-label="Switch between light and dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <!-- Icon fixed 11/10/2026: the previous path (a kite/arrow shape) read as a map/location pin, not a
           mouse pointer. Replaced with a mouse-cursor arrow (plus its little "click" tick), which is what
           this toggle actually controls (pointer tracking, cursor ring, card spotlight and tilt). -->
      <button class="icon-btn" id="fxBtn" title="Mouse effects on or off" aria-label="Turn the mouse effects on or off"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3l7 17 2.4-7.1L20 10.5z"/><path d="M13 13l6 6"/></svg></button>
    </div>
  </header>
  <main>
    <section class="view active" id="view-game"></section>
    <section class="view" id="view-rand"></section>
    <section class="view" id="view-run"></section>
    <p class="footer-note">Pokemon Randomizer YAO is a fork of the Universal Pokemon Randomizer FVX and is distributed under the GPL. Pokemon and the names of its games belong to Nintendo, Game Freak and Creatures. You need your own legally obtained copy of a game.</p>
  </main>
</div>
<div id="tip" role="tooltip"></div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="app.js"></script>
</body>
</html>
