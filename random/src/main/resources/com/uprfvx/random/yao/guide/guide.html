<!-- The same display and mono faces as the web interface. They are an extra: offline, or if they cannot load, the
     system fonts in the stacks below are used and the page looks the same apart from the letter shapes. The
     stylesheet is loaded without blocking the first paint. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #06070d; --bg2: #0b0d18; --panel: rgba(15, 18, 34, 0.78); --panel-hi: rgba(26, 31, 58, 0.85); --panel-solid: #101322;
  --line: rgba(124, 146, 255, 0.16); --line-hi: rgba(124, 146, 255, 0.38);
  --text: #e9edff; --muted: #8f98c2; --faint: #5d6590;
  --cyan: #26e6ff; --pink: #ff3fa8; --amber: #ffc94a; --red: #ff5470; --violet: #8b6bff;
  --accent: #ff4a3d; --accent-dim: rgba(255, 74, 61, 0.14); --led: #35e38a; --led-dim: rgba(53, 227, 138, 0.16);
  --changed: rgba(255, 74, 61, 0.13); --changed-line: #ff4a3d;
  --radius: 16px; --glow: 0 0 22px rgba(255, 74, 61, 0.35);
  --font: "Inter", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
  --display: "Chakra Petch", "Inter", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #eef1fb; --bg2: #e4e9f8; --panel: rgba(255, 255, 255, 0.82); --panel-hi: rgba(255, 255, 255, 0.97); --panel-solid: #ffffff;
  --line: rgba(80, 96, 190, 0.2); --line-hi: rgba(80, 96, 190, 0.45);
  --text: #141833; --muted: #55608f; --faint: #8890b8;
  --cyan: #0a8fb5; --pink: #d1237f; --amber: #a56a00; --red: #c4243f; --violet: #5a3fe0;
  --accent: #b72b22; --accent-dim: rgba(183, 43, 34, 0.1); --led: #0d713e; --led-dim: rgba(13, 113, 62, 0.14);
  --changed: rgba(183, 43, 34, 0.09); --changed-line: #b72b22;
  --glow: 0 0 18px rgba(183, 43, 34, 0.25);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body { margin: 0; }
body {
  font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--text); min-height: 100vh;
  background: radial-gradient(1200px 700px at 78% -10%, rgba(139, 107, 255, 0.16), transparent 60%),
              radial-gradient(900px 600px at -10% 20%, rgba(38, 230, 255, 0.10), transparent 60%), var(--bg);
  background-attachment: fixed;
}
a { color: var(--cyan); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: rgba(38, 230, 255, 0.3); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(124, 146, 255, 0.28); border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; padding: 8px 14px; background: var(--accent); color: #1a0603; border-radius: 10px; font-weight: 700; text-decoration: none; }
.skip:focus { top: 10px; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .mono { font-family: var(--mono); }
.hidden { display: none !important; }

/* header */
header.top {
  position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 14px 22px; flex-wrap: wrap;
  padding: 12px 28px; border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  background: linear-gradient(to bottom, rgba(6, 7, 13, 0.92), rgba(6, 7, 13, 0.6));
}
:root[data-theme="light"] header.top { background: linear-gradient(to bottom, rgba(238, 241, 251, 0.95), rgba(238, 241, 251, 0.65)); }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { width: 34px; height: 34px; flex: none; filter: drop-shadow(0 0 10px rgba(255, 74, 61, 0.6)); }
.brand .name { font-family: var(--display); font-weight: 700; letter-spacing: .12em; font-size: 13px; text-transform: uppercase;
  background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.brand .game { display: block; font-size: 15px; font-weight: 700; letter-spacing: 0; text-transform: none; color: var(--text); -webkit-text-fill-color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46vw; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 11px; border-radius: 999px; font-size: 12px; font-weight: 650; border: 1px solid var(--line-hi); color: var(--muted); white-space: nowrap; }
.pill.cyan { color: var(--cyan); border-color: rgba(38, 230, 255, 0.45); background: rgba(38, 230, 255, 0.08); }
.pill.ok { color: var(--led); border-color: rgba(53, 227, 138, 0.45); background: var(--led-dim); }
.tools { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: 12px; border: 1px solid var(--line); background: rgba(5, 7, 16, 0.45); }
:root[data-theme="light"] .seg { background: rgba(255, 255, 255, 0.6); }
.seg button { border: none; background: transparent; padding: 5px 12px; border-radius: 9px; color: var(--muted); font-weight: 700; font-size: 13px; }
.seg button:hover { color: var(--text); background: rgba(124, 146, 255, 0.1); }
.seg button[aria-pressed="true"] { color: #1a0603; background: linear-gradient(120deg, var(--accent), #ff8a66); box-shadow: var(--glow); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
.icon-btn:hover { color: var(--text); border-color: var(--line-hi); }
.toggle { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 6px; border-radius: 999px; border: 1px solid var(--line-hi); background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; }
.toggle .led { width: 26px; height: 14px; border-radius: 999px; background: rgba(124, 146, 255, 0.18); border: 1px solid var(--line-hi); position: relative; transition: all .2s; }
.toggle .led::after { content: ""; position: absolute; top: 1px; left: 1px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); transition: all .2s; }
.toggle[aria-pressed="true"] { color: var(--text); border-color: var(--led); }
.toggle[aria-pressed="true"] .led { background: var(--led-dim); border-color: var(--led); box-shadow: 0 0 10px var(--led-dim); }
.toggle[aria-pressed="true"] .led::after { left: 13px; background: var(--led); box-shadow: 0 0 6px var(--led); }

/* layout */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 26px; max-width: 1360px; margin: 0 auto; padding: 24px 28px 70px; }
nav.side { position: sticky; top: 84px; align-self: start; display: flex; flex-direction: column; gap: 6px; }
nav.side button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 12px; border-radius: 12px; border: 1px solid transparent;
  background: transparent; color: var(--muted); font-weight: 650; position: relative;
}
nav.side button .t { flex: 1; }
nav.side button .n { font-family: var(--mono); font-size: 11.5px; min-width: 34px; text-align: center; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--faint); }
nav.side button .n.has { color: var(--accent); border-color: rgba(255, 74, 61, 0.4); background: var(--accent-dim); }
nav.side button:hover { color: var(--text); background: rgba(124, 146, 255, 0.08); }
nav.side button[aria-current="page"] { color: var(--text); border-color: var(--line-hi); background: linear-gradient(120deg, rgba(255, 74, 61, 0.14), rgba(139, 107, 255, 0.14)); box-shadow: var(--glow); }
nav.side .label { font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-size: 11px; color: var(--faint); padding: 0 12px 6px; }
main { min-width: 0; }
.view { animation: rise .4s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } html { scroll-behavior: auto; } }
h1.hero { font-size: clamp(26px, 4vw, 44px); line-height: 1.08; margin: 4px 0 8px; font-weight: 800; letter-spacing: -.02em; }
h1.hero em { font-style: normal; background: linear-gradient(90deg, var(--cyan), var(--violet) 55%, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
h2 { font-family: var(--display); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
h3 { font-size: 15px; margin: 0 0 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; margin: 0 0 18px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid.tiles { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.tile { text-align: left; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: rgba(124, 146, 255, 0.05); display: block; width: 100%; }
button.tile:hover { border-color: var(--line-hi); background: rgba(124, 146, 255, 0.1); }
.tile .v { font-size: 26px; font-weight: 800; font-family: var(--mono); color: var(--accent); line-height: 1.1; }
.tile .v small { font-size: 13px; color: var(--faint); font-weight: 500; }
.tile .l { font-size: 12px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; margin-top: 2px; }
.tile .bar { height: 5px; border-radius: 99px; background: rgba(124, 146, 255, 0.16); margin-top: 10px; overflow: hidden; }
.tile .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--violet)); border-radius: 99px; }
.tile.zero .v { color: var(--faint); }
ul.plain { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
ul.plain li { padding: 9px 14px; border-left: 3px solid var(--line-hi); background: rgba(124, 146, 255, 0.05); border-radius: 0 10px 10px 0; font-size: 14px; overflow-wrap: anywhere; }
ul.plain.warn li { border-color: var(--amber); background: rgba(255, 201, 74, 0.07); }
ul.plain.extra li { border-color: var(--accent); background: var(--accent-dim); }
.note { border-left: 3px solid var(--amber); padding: 10px 16px; background: rgba(255, 201, 74, 0.07); border-radius: 0 10px 10px 0; font-size: 14px; margin: 0 0 16px; }

/* controls over tables */
.bar { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-bottom: 16px; }
input[type=search], select {
  background: rgba(5, 7, 16, 0.6); border: 1px solid var(--line-hi); border-radius: 10px; padding: 8px 12px; outline: none; min-width: 0;
}
:root[data-theme="light"] input[type=search], :root[data-theme="light"] select { background: rgba(255, 255, 255, 0.92); }
input[type=search] { flex: 1 1 220px; }
input[type=search]:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 74, 61, 0.18); }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line-hi); background: transparent; color: var(--muted); font-weight: 600; font-size: 13px; }
.chip:hover { color: var(--text); border-color: var(--accent); }
.chip[aria-pressed="true"] { color: #1a0603; background: var(--accent); border-color: var(--accent); box-shadow: var(--glow); }
.count { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* tables */
.tablewrap { overflow: auto; max-height: 74vh; border: 1px solid var(--line); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.45; }
th { position: sticky; top: 0; z-index: 2; background: var(--panel-solid); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 700; white-space: nowrap; }
th .thbtn { background: none; border: none; padding: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; font-weight: inherit; }
th .thbtn:hover { color: var(--text); }
td.types { min-width: 176px; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
tr.row:hover td { background: rgba(124, 146, 255, 0.07); }
tr.detail > td { background: rgba(124, 146, 255, 0.07); padding: 16px 20px; }
td.changed { background: var(--changed); box-shadow: inset 2px 0 0 var(--changed-line); }
.was { display: block; color: var(--muted); font-size: .76rem; text-decoration: line-through; opacity: .85; font-weight: 400; }
.rowbtn { background: none; border: none; padding: 0; font-weight: 650; text-align: left; }
.rowbtn:hover { color: var(--accent); }
.tag { display: inline-block; white-space: nowrap; padding: 2px 10px; margin: 3px 6px 3px 0; border-radius: 999px; font-size: .78rem; border: 1px solid var(--line-hi); background: rgba(124, 146, 255, 0.07); }
.tag.type { color: #0a0d18; font-weight: 700; border-color: transparent; text-shadow: 0 1px 0 rgba(255, 255, 255, 0.25); }
.tag.changed { background: var(--changed); border-color: var(--changed-line); }
.ab { display: inline-block; padding: 1px 9px; margin: 3px 6px 3px 0; border-radius: 8px; font-size: .8rem; background: rgba(139, 107, 255, 0.14); border: 1px solid rgba(139, 107, 255, 0.3); }
.pill-evo { color: var(--muted); font-size: .78rem; }
.stat { display: inline-block; min-width: 2.2em; text-align: right; }
details.card > summary { cursor: pointer; padding: 2px 0; list-style: none; display: flex; gap: 8px 12px; align-items: center; flex-wrap: wrap; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary::before { content: "\25B8"; color: var(--accent); transition: transform .15s; }
details.card[open] > summary::before { transform: rotate(90deg); }
details.card[open] > summary { margin-bottom: 14px; }

/* spoiler-safe: blurred until revealed, with an intentional veil */
.spoiler { position: relative; }
body.hide .spoiler:not(.revealed) > .inner { filter: blur(11px) saturate(.7); pointer-events: none; user-select: none; max-height: 460px; overflow: hidden; opacity: .75; }
body.hide .spoiler:not(.revealed) > .veil { display: flex; }
.veil { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; z-index: 5; padding: 12px; }
.veil .box { text-align: center; padding: 20px 26px; border-radius: var(--radius); background: var(--panel-hi); border: 1px solid var(--line-hi); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), var(--glow); max-width: 420px; }
.veil .box b { font-family: var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-size: 13px; display: block; margin-bottom: 4px; }
.veil .box p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; }
.btn { border: 1px solid transparent; border-radius: 12px; padding: 9px 18px; font-weight: 700; color: #1a0603; background: linear-gradient(120deg, var(--accent), #ff8a66 55%, var(--violet)); box-shadow: var(--glow); }
.btn:hover { filter: brightness(1.1); }
.btn.ghost { color: var(--text); background: transparent; border-color: var(--line-hi); box-shadow: none; }

/* the log viewer */
.logbox { background: #04050b; border: 1px solid var(--line); border-radius: 14px; max-height: 72vh; overflow: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; padding: 8px 0; }
:root[data-theme="light"] .logbox { background: #fdfdff; }
.ln { display: flex; gap: 14px; padding: 0 14px; white-space: pre-wrap; overflow-wrap: anywhere; color: #b8c2ee; }
:root[data-theme="light"] .ln { color: #2b3260; }
.ln:hover { background: rgba(124, 146, 255, 0.08); }
.ln .no { flex: none; width: 5.5ch; text-align: right; color: var(--faint); user-select: none; }
.ln.banner { color: var(--accent); font-weight: 700; }
.ln.rule { color: var(--faint); }
.ln.warn { color: var(--amber); }
mark { background: rgba(255, 201, 74, 0.4); color: inherit; border-radius: 3px; }
footer { margin-top: 30px; color: var(--muted); font-size: .8rem; text-align: center; }


/* wild places, game order, ways to meet a Pokemon (added 12/10/2026) */
.ord { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
details.card > summary .ord, .cardhead .ord { padding: 2px 9px; border: 1px solid var(--line-hi); border-radius: 999px; background: rgba(124, 146, 255, 0.08); }
.waylist { display: flex; flex-wrap: wrap; gap: 8px 10px; }
.way { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; padding: 4px 12px; border-radius: 999px; font-size: 12.5px; border: 1px solid var(--line-hi); background: rgba(124, 146, 255, 0.07); }
.way b { font-weight: 650; }
.way i { font-style: normal; color: var(--muted); }
.way.pg { border-style: dashed; }
td.ways { min-width: 260px; }
.place td.num { white-space: nowrap; }
.mv { display: inline-block; padding: 2px 10px; margin: 3px 6px 3px 0; border-radius: 8px; font-size: .82rem; border: 1px solid var(--line); background: rgba(124, 146, 255, 0.06); white-space: nowrap; }
.dl { margin: 0 0 16px; line-height: 1.9; }
.dl:last-child { margin-bottom: 0; }
.detailgrid > div > b { display: block; margin-bottom: 8px; }
.detailgrid { gap: 14px 28px; }
.legend { margin: 0 0 16px; max-width: 80ch; font-size: 13.5px; }
.cardhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px 8px; }
.tags .tag { margin: 0; }
.tablewrap.flat { max-height: none; border-radius: 12px; }
.gone { margin: 14px 4px 2px; font-size: 13.5px; }
.was.inline { display: inline; }
ul.finds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
ul.finds li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 12px; align-items: start; }
ul.finds .ftext { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
ul.finds .fhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
ul.finds .ftext .waylist { margin-top: 2px; }
.card .cardhead + .tags { margin-top: 2px; }
.ordcol { padding-top: 3px; }

@media (max-width: 960px) {
  header.top { padding: 10px 14px; position: static; }
  .shell { grid-template-columns: minmax(0, 1fr); padding: 14px 14px 60px; gap: 14px; }
  nav.side { position: sticky; top: 0; z-index: 40; flex-direction: row; overflow-x: auto; gap: 6px; padding: 8px 0; margin: 0 -14px; padding-left: 14px; padding-right: 14px;
    background: linear-gradient(to bottom, var(--bg) 60%, transparent); }
  nav.side .label { display: none; }
  nav.side button { width: auto; flex: none; white-space: nowrap; padding: 7px 12px; }
  .brand .game { max-width: 60vw; }
  .tools { margin-left: 0; width: 100%; }
}

@media (max-width: 700px) {
  /* tables inside place and trainer cards become one block per row so nothing needs a sideways scroll */
  .place table, .place tbody { display: block; }
  .place tr.hd { display: none; }
  .place tr.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; padding: 14px 14px; border-bottom: 1px solid var(--line); }
  .place tr.row:last-child { border-bottom: 0; }
  .place tr.row td { display: block; border: 0; padding: 0; }
  .place tr.row td:nth-child(n+3) { grid-column: 1 / -1; min-width: 0; }
  .place tr.row td.num { text-align: right; }
  .place tr.row td:empty { display: none; }
  td.ways { min-width: 0; }
  .tablewrap.flat { overflow: visible; }
  tr.detail > td > .grid { position: sticky; left: 0; width: calc(100vw - 76px); grid-template-columns: minmax(0, 1fr); }
  ul.finds li { grid-template-columns: 44px minmax(0, 1fr); gap: 10px; }
  .card { padding: 16px 16px; }
}

@media (max-width: 560px) {
  body { font-size: 14px; }
  .chips .pill:nth-child(n+3) { display: none; }
  .grid.tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile .v { font-size: 22px; }
  .tools { gap: 6px; }
  .toggle { padding: 3px 10px 3px 5px; font-size: 12px; }
  th, td { padding: 5px 7px; }
  .veil .box { padding: 14px; }
}
@media print {
  body { background: #fff; color: #000; }

<script>
"use strict";
const DATA = /*__GUIDE_DATA__*/null;
/* Every visible string, English and Spanish, comes from this one dictionary (guide-strings.json). */
const STR = /*__GUIDE_STRINGS__*/null;

const TYPE_COLORS = { NORMAL:"#a8a77a", FIRE:"#ee8130", WATER:"#6390f0", ELECTRIC:"#f7d02c", GRASS:"#7ac74c", ICE:"#96d9d6", FIGHTING:"#c22e28",
  POISON:"#a33ea1", GROUND:"#e2bf65", FLYING:"#a98ff3", PSYCHIC:"#f95587", BUG:"#a6b91a", ROCK:"#b6a136", GHOST:"#8a6fc0", DRAGON:"#7a4dfc",
  DARK:"#8a6f5c", STEEL:"#b7b7ce", FAIRY:"#e69bc0" };

/* ---------- state ---------- */
const META = DATA.meta || {};
const S = { lang: META.lang === "es" ? "es" : "en", tab: "ov", showOrig: false, changedOnly: false, sort: {}, filter: {}, open: {}, revealed: {}, lim: {},
  logStart: 0, logLimit: 1200 };
try { const l = localStorage.getItem("guideLang"); if (l === "es" || l === "en") S.lang = l; } catch (e) {}
try { const th = localStorage.getItem("guideTheme"); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
const has = k => !!(STR.strings[k]);
const t = (k, vars) => {
  const e = STR.strings[k];
  let s = e ? (e[S.lang] || e.en) : k;
  if (vars) for (const [n, v] of Object.entries(vars)) s = s.split("{" + n + "}").join(String(v));
  return s;
};
const O = DATA.original || {}, R = DATA.randomized || {};

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : "";
const pretty = s => String(s ?? "").toLowerCase().split(/[_\s-]+/).filter(Boolean).map(cap).join(" ");
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const byId = (arr, key = "id") => { const m = new Map(); (arr || []).forEach(x => { if (x) m.set(x[key], x); }); return m; };
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const num = n => Number(n).toLocaleString(S.lang === "es" ? "es-ES" : "en-GB");
const spO = byId(O.species), spR = byId(R.species), mvO = byId(O.moves), mvR = byId(R.moves);
const abO = byId(O.abilities), abR = byId(R.abilities), itO = byId(O.items), itR = byId(R.items);
/* Every game term is written in both languages by the program (guide-names.json), whatever the ROM's language is:
   ne is the English name, ns the Spanish one, and name is the ROM's own text (the fallback). */
const nm = o => o ? ((S.lang === "es" ? o.ns : o.ne) || o.name || "") : "";
const spName = (id, orig) => nm((orig ? spO : spR).get(id) || spR.get(id) || spO.get(id)) || "#" + id;
const mvName = (id, orig) => id ? (nm((orig ? mvO : mvR).get(id) || mvR.get(id) || mvO.get(id)) || "#" + id) : "-";
const abName = (id, orig) => nm((orig ? abO : abR).get(id) || abR.get(id) || abO.get(id)) || "#" + id;
const itName = (id, orig) => id ? (nm((orig ? itO : itR).get(id) || itR.get(id) || itO.get(id)) || "#" + id) : "";
const PLACES = DATA.placeNames || {};
const SMALL = new Set(["of", "the", "de", "del", "la", "las", "los", "el", "al", "y", "and", "at", "in", "on"]);
const placeCase = s => String(s).toLowerCase().split(" ").map((w, i) => i && SMALL.has(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
/* Some games store a trainer's name as a text code such as "[~ 61]"; it means nothing to a reader. */
const cleanName = n => String(n ?? "").replace(/\s*\[~ \d+\]/g, "").trim() || String(n ?? "");
const typeName = ty => has("type" + ty) ? t("type" + ty) : pretty(ty);
const catName = c => has("cat" + c) ? t("cat" + c) : pretty(c);
const typeTag = ty => `<span class="tag type" style="background:${TYPE_COLORS[ty] || "#8aa0c8"}">${esc(typeName(ty))}</span>`;
const bst = a => (a.stats || []).reduce((x, y) => x + y, 0);

function evoText(e) {
  if (!e.type) return t("evoUnknown");
  const key = "evo" + e.type;
  /* the extra value is an item, a move or a Pokemon id for some methods: named in the language being shown */
  let x = e.x;
  if (e.xk === "item") x = itName(e.extra);
  else if (e.xk === "move") x = mvName(e.extra);
  else if (e.xk === "species") x = spName(e.extra);
  if (!has(key)) return pretty(e.type) + (x && x !== "0" ? " " + x : "");
  return t(key, { x });
}
function tagName(tag) {
  if (!tag) return "";
  let m;
  if ((m = /^GYM(\d+)-LEADER$/.exec(tag))) return t("tagGymLeader", { x: m[1] });
  if ((m = /^GYM(\d+)/.exec(tag))) return t("tagGym", { x: m[1] });
  if ((m = /^ELITE(\d+)/.exec(tag))) return t("tagElite", { x: m[1] });
  if (tag === "CHAMPION") return t("tagChampion");
  if ((m = /^RIVAL(\d+)/.exec(tag))) return t("tagRival", { x: m[1] });
  if (tag === "UBER") return t("tagUber");
  if ((m = /^THEMED:(.+)$/.exec(tag))) {
    const parts = m[1].split("-");
    return t("tagThemed", { x: pretty(parts[0]) + (parts[1] ? " (" + parts[1].toLowerCase() + ")" : "") });
  }
  return pretty(tag);
}
/* Shop names are written by the program in English around the game's own place names. In Spanish the known English
   words (Primary, Badges, Poke Mart...) are translated; the place names stay as they are. Place names of the wild
   tab come from a table of official names by location tag, with the term rules below as the fallback for tags the
   table does not know. */
const rxEsc = s => s.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&");
function translateTerms(name, terms, reverse) {
  if (!name) return name;
  let out = name;
  for (const pair of terms) {
    const [from, to] = reverse ? [pair[1], pair[0]] : pair;
    const re = new RegExp((/^[\p{L}]/u.test(from) ? "(?<![\\p{L}])" : "") + rxEsc(from) + (/[\p{L}]$/u.test(from) ? "(?![\\p{L}])" : ""), "gu");
    out = out.replace(re, to);
  }
  return out;
}
/* Generic English place patterns written the Spanish way ("Vermilion City" is "Ciudad Vermilion" in a pattern, the
   proper noun is kept when no official name is known). */
const PLACE_PATTERNS_ES = [[/^(.+) City$/, "Ciudad $1"], [/^(.+) Town$/, "Pueblo $1"], [/^(.+) Village$/, "Pueblo $1"], [/^(.+) Cave$/, "Cueva $1"],
  [/^(.+) Cavern$/, "Caverna $1"], [/^(.+) Forest$/, "Bosque $1"], [/^(.+) Tower$/, "Torre $1"], [/^(.+) Island$/, "Isla $1"], [/^(.+) Islands$/, "Islas $1"],
  [/^(.+) Mountain$/, "Monte $1"], [/^(.+) Tunnel$/, "T\u00fanel $1"], [/^(.+) Bay$/, "Bah\u00eda $1"], [/^(.+) Ruins$/, "Ruinas $1"], [/^(.+) Falls$/, "Cascadas $1"],
  [/^(.+) Desert$/, "Desierto $1"], [/^(.+) Bridge$/, "Puente $1"], [/^(.+) Path$/, "Camino $1"], [/^(.+) Garden$/, "Jard\u00edn $1"],
  [/^(.+) Shrine$/, "Santuario $1"], [/^(.+) Temple$/, "Templo $1"], [/^(.+) Mansion$/, "Mansi\u00f3n $1"], [/^(.+) Hideout$/, "Guarida $1"],
  [/^(.+) Marsh$/, "Pantano $1"], [/^(.+) Beach$/, "Playa $1"], [/^(.+) Sewers$/, "Cloacas $1"], [/^Lake (.+)$/, "Lago $1"], [/^Mt\. (.+)$/, "Monte $1"]];
function placeEs(en) {
  for (const [re, to] of PLACE_PATTERNS_ES) if (re.test(en)) return translateTerms(en.replace(re, to), STR.areaTerms);
  return translateTerms(en, STR.areaTerms);
}
/* Place text that came from the ROM itself (a map name with no program tag) is already in the ROM's language. */
const romText = (n, terms) => {
  if (S.lang === "es") return META.romLang === "es" ? n : translateTerms(n, terms);
  return META.romLang === "es" ? translateTerms(n, terms, true) : n;
};
const shopName = n => S.lang === "es" ? translateTerms(n, STR.shopTerms) : n;
/* The name of a wild place in the current language. Unnamed Platinum maps count up inside their own list. */
function placeName(p, nth) {
  if (p.tag === "UNKNOWN") return t("placeUnknown") + (nth ? " " + nth : "");
  if (p.tag) {
    const pn = PLACES[p.tag];
    if (pn) return pn[S.lang === "es" ? 1 : 0];
    const en = placeCase(p.tag);
    return S.lang === "es" ? placeEs(en) : en;
  }
  return romText(p.name, STR.areaTerms);
}

/* A changed cell is tinted and shows the original as a small crossed-out line; with "show original values" on, the
   cell shows the original instead. The original is also in the tooltip. */
function cell(now, was, cls = "", plainWas, display) {
  const changed = !same(now, was);
  const shown = S.showOrig && changed ? was : (display ?? now);
  const tip = changed ? ` title="${esc(t("wasIs", { v: plainWas ?? String(was).replace(/<[^>]*>/g, "") }))}"` : "";
  return `<td class="${cls}${changed ? " changed" : ""}"${tip}>${shown}${!S.showOrig && changed ? `<span class="was">${was}</span>` : ""}</td>`;
}
function spoiler(inner) {
  return `<div class="spoiler${S.revealed[S.tab] ? " revealed" : ""}"><div class="inner">${inner}</div><div class="veil"><div class="box"><b>${esc(t("hiddenTitle"))}</b><p>${esc(t("hiddenHint"))}</p><button class="btn" type="button" data-reveal>${esc(t("reveal"))}</button></div></div></div>`;
}
function sortRows(rows, key, cols) {
  const s = S.sort[key]; if (!s) return rows;
  const col = cols.find(c => c.id === s.col); if (!col) return rows;
  return rows.slice().sort((a, b) => {
    const x = col.val(a), y = col.val(b);
    const r = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), S.lang);
    return s.dir * r;
  });
}
function head(key, cols) {
  return "<tr>" + cols.map(c => {
    const st = S.sort[key]?.col === c.id ? S.sort[key].dir : 0;
    return `<th scope="col" class="${c.num ? "num" : ""}" aria-sort="${st > 0 ? "ascending" : st < 0 ? "descending" : "none"}"><button class="thbtn" type="button" data-sort="${key}:${c.id}">${esc(c.label)}${st ? (st > 0 ? " &#9650;" : " &#9660;") : ""}</button></th>`;
  }).join("") + "</tr>";
}
const searchBox = (key, ph) => `<input type="search" data-filter="${key}" value="${esc(S.filter[key] || "")}" placeholder="${esc(ph || t("search"))}" aria-label="${esc(ph || t("search"))}">`;
const changedChip = () => `<button class="chip" type="button" id="btnChanged" aria-pressed="${S.changedOnly}">${esc(t("changedOnly"))}</button>`;

/* ---------- what changed, counted once ---------- */
let STATS = null;
function computeStats() {
  const c = { stats: 0, types: 0, abilities: 0, evolutions: 0, learnsets: 0, compat: 0, species: 0, moves: 0, wild: 0, statics: 0, trades: 0, trainers: 0, shops: 0, tmList: 0, starters: 0 };
  const total = { species: (R.species || []).length, moves: (R.moves || []).filter(Boolean).length, wild: (R.wild || []).length, statics: (R.statics || []).length,
    trades: (R.trades || []).length, trainers: (R.trainers || []).length, shops: (R.shops || []).length };
  const speciesChanged = new Set();
  for (const r of R.species || []) {
    const o = spO.get(r.id); if (!o) continue;
    const f = { stats: !same(r.stats, o.stats), types: !same(r.types, o.types), abilities: !same(r.abilities, o.abilities), evolutions: !same(r.evos, o.evos),
      learnsets: !same(r.learn, o.learn) || !same(r.egg, o.egg), compat: !same(r.tm, o.tm) || !same(r.hm, o.hm) || !same(r.tut, o.tut) };
    let any = f.stats || f.types || f.abilities || f.evolutions || f.learnsets || f.compat;
    for (const k of Object.keys(f)) if (f[k]) c[k]++;
    if (any) speciesChanged.add(r.id);
  }
  c.species = speciesChanged.size;
  STATS = { c, total, speciesChanged };
  for (const r of R.moves || []) { const o = r && mvO.get(r.id); if (o && !same(r, o)) c.moves++; }
  (R.wild || []).forEach((a, i) => { if (placeChanged(a, wildOrig().get(wildKeysR()[i]))) c.wild++; });
  (R.statics || []).forEach((s, i) => { if (!same(s, (O.statics || [])[i] || s)) c.statics++; });
  (R.trades || []).forEach((s, i) => { if (!same(s, (O.trades || [])[i] || s)) c.trades++; });
  (R.trainers || []).forEach((s, i) => { if (!same(s.party, ((O.trainers || [])[i] || s).party)) c.trainers++; });
  (R.shops || []).forEach((s, i) => { if (!same(s.items, ((O.shops || [])[i] || s).items)) c.shops++; });
  for (const k of ["tms", "hms", "tutors"]) (R[k] || []).forEach((m, i) => { if (m !== (O[k] || [])[i]) c.tmList++; });
  if (!same(R.starters, O.starters)) c.starters = 1;
}
const statsOf = () => { if (!STATS) computeStats(); return STATS; };

/* ---------- the log, split into lines once ---------- */
let LOGLINES = null;
const logLines = () => LOGLINES || (LOGLINES = String(DATA.log || "").replace(/\r/g, "").split("\n"));
const BANNER = /^\s*\(\s*(.+?)\s*\{([A-Z0-9]{3,5})\}\s*\)\s*$/;

/* ---------- tabs ---------- */
const TABS = [["ov","tabOverview"],["pk","tabPokemon"],["mv","tabMoves"],["wd","tabWild"],["fd","tabFind"],["st","tabStatic"],["tr","tabTrades"],["tn","tabTrainers"],["sh","tabShops"],["lg","tabLog"]];
function tabCount(id) {
  const { c } = statsOf();
  switch (id) {
    case "pk": return c.species; case "mv": return c.moves; case "wd": return c.wild; case "st": return c.statics;
    case "tr": return c.trades; case "tn": return c.trainers; case "sh": return c.shops;
    case "lg": return DATA.log ? logLines().length : null;
    default: return null;
  }
}

function tile(label, n, m, tab) {
  const pct = m ? Math.round(100 * n / m) : 0;
  const body = `<div class="v">${num(n)}${m ? ` <small>/ ${num(m)}</small>` : ""}</div><div class="l">${esc(label)}</div>${m ? `<div class="bar"><i style="width:${pct}%"></i></div>` : ""}`;
  return tab ? `<button class="tile${n ? "" : " zero"}" type="button" data-tab="${tab}">${body}</button>` : `<div class="tile${n ? "" : " zero"}">${body}</div>`;
}

function renderOverview() {
  const { c, total } = statsOf();
  const sum = DATA.summary || {};
  const errs = (R.errors || []).concat(O.errors || []);
  const warnings = (DATA.notes || []);
  const listNote = S.lang === "es" ? `<p class="faint" style="margin:8px 0 0;font-size:13px">${esc(t("listsLang"))}</p>` : "";
  const list = (items, cls) => items.length ? `<ul class="plain ${cls}">${items.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "";
  const settingsHtml = (sum.changed && sum.changed.length) || (sum.extras && sum.extras.length)
    ? `${(sum.changed || []).length ? `<h3>${esc(t("settingsChanged"))} <span class="count">(${(sum.changed || []).length})</span></h3>${list(sum.changed, "")}` : ""}
       ${(sum.extras || []).length ? `<h3 style="margin-top:14px">${esc(t("extrasTitle"))} <span class="count">(${sum.extras.length})</span></h3>${list(sum.extras, "extra")}` : ""}${listNote}`
    : `<p class="muted">${esc(t("settingsDefault"))}</p>`;
  return `<div class="view">
    <h1 class="hero">${esc(t("overviewTitle"))}: <em>${esc(META.rom || "")}</em></h1>
    <p class="muted" style="margin:0 0 16px;max-width:70ch">${esc(t("overviewLead"))}</p>
    <div class="note">${esc(t("warn"))}</div>
    <div class="card"><h2>${esc(t("summaryTitle"))}</h2>
      <div class="grid tiles">
        ${tile(t("aspStats"), c.stats, total.species, "pk")}${tile(t("aspTypes"), c.types, total.species, "pk")}${tile(t("aspAbilities"), c.abilities, total.species, "pk")}
        ${tile(t("aspEvolutions"), c.evolutions, total.species, "pk")}${tile(t("aspLearnsets"), c.learnsets, total.species, "pk")}${tile(t("aspCompat"), c.compat, total.species, "pk")}
        ${tile(t("aspMoveData"), c.moves, total.moves, "mv")}${tile(t("aspTmList"), c.tmList, (R.tms || []).length + (R.hms || []).length + (R.tutors || []).length, "mv")}
        ${R.wild ? tile(t("aspWild"), c.wild, total.wild, "wd") : ""}${R.statics ? tile(t("aspStatic"), c.statics, total.statics, "st") : ""}${(R.trades || []).length ? tile(t("aspTrades"), c.trades, total.trades, "tr") : ""}
        ${R.trainers ? tile(t("aspTrainers"), c.trainers, total.trainers, "tn") : ""}${R.shops ? tile(t("aspShops"), c.shops, total.shops, "sh") : ""}
      </div>
      <p class="muted" style="margin:12px 0 0;font-size:13px">${esc(t("changedLegend"))}</p></div>
    <div class="card"><h2>${esc(t("settingsTitle"))}</h2>${settingsHtml}</div>
    <div class="card"><h2>${esc(t("warningsTitle"))}</h2>${warnings.length ? list(warnings, "warn") : `<p class="muted">${esc(t("noWarnings"))}</p>`}${warnings.length ? listNote : ""}
      ${errs.length ? `<h3 style="margin-top:12px">${esc(t("errors"))}</h3>${list(errs, "warn")}` : ""}</div>
    <div class="card"><h2>${esc(t("gameTitle"))}</h2>
      <p style="margin:0"><b>${esc(t("rom"))}:</b> ${esc(META.rom)} <span class="pill">${esc(META.code)}</span><br>
      <b>${esc(t("gen"))}:</b> ${esc(META.generation)} &nbsp; <b>${esc(t("seed"))}:</b> <span class="mono">${esc(META.seed < 0 ? t("seedRandom") : META.seed)}</span>
      &nbsp; <b>${esc(t("date"))}:</b> ${esc(META.date)} &nbsp; <b>${esc(t("version"))}:</b> ${esc(META.version || "")}</p></div>
  </div>`;
}

function abilityChips(r) {
  return (r.abilities || []).map(id => `<span class="ab">${esc(abName(id))}</span>`).join("");
}
const abilityText = r => (r.abilities || []).map(id => abName(id)).join(", ");
function renderPokemon() {
  const cols = [
    { id: "id", label: "#", num: true, val: r => r.id },
    { id: "name", label: t("name"), val: r => nm(r) },
    { id: "type", label: t("type"), val: r => (r.types || []).map(typeName).join("/") },
    { id: "hp", label: t("statHp"), num: true, val: r => r.stats?.[0] ?? 0 }, { id: "atk", label: t("statAtk"), num: true, val: r => r.stats?.[1] ?? 0 },
    { id: "def", label: t("statDef"), num: true, val: r => r.stats?.[2] ?? 0 }, { id: "spa", label: t("statSpa"), num: true, val: r => r.stats?.[3] ?? 0 },
    { id: "spd", label: t("statSpd"), num: true, val: r => r.stats?.[4] ?? 0 }, { id: "spe", label: t("statSpe"), num: true, val: r => r.stats?.[5] ?? 0 },
    { id: "bst", label: t("total"), num: true, val: r => bst(r) },
    { id: "abil", label: t("abilities"), val: r => abilityText(r) }
  ];
  const q = norm(S.filter.pk), tf = S.filter.pkType || "";
  const { speciesChanged } = statsOf();
  let rows = (R.species || []).filter(r => (!q || norm(nm(r)).includes(q) || String(r.id) === q || (r.abilities || []).some(a => norm(abName(a)).includes(q)))

/* ---------- wild places: one row per Pokemon per place ---------- */
/* The program writes the places already grouped: one entry per place with one table per method and variant (time of
   day, season), each table listing a Pokemon once with its level range and chance. Here the tables of a place are
   folded into rows, one per Pokemon, and each way of meeting it is a chip. */
function placeKeys(list) {
  const seen = {}; const keys = [];
  (list || []).forEach(p => { const base = p.tag || ("~" + p.name); seen[base] = (seen[base] || 0) + 1; keys.push(p.tag === "UNKNOWN" ? base + "#" + seen[base] : base); });
  return keys;
}
const wildKeysR = () => (wildKeysR.c = wildKeysR.c || placeKeys(R.wild));
const wildOrig = () => { if (!wildOrig.m) { wildOrig.m = new Map(); const k = placeKeys(O.wild); (O.wild || []).forEach((p, i) => wildOrig.m.set(k[i], p)); } return wildOrig.m; };
const tableKey = tb => tb.m + "|" + tb.v;
const lvText = (lo, hi) => lo === hi ? String(lo) : lo + "-" + hi;
/* method and variant names are looked up by a computed key, "m_<method>" and "v_<variant>" in the strings file */
const dynText = (prefix, k) => { const key = prefix + k; return STR.strings[key] ? t(key) : null; };
function methodLabel(tb, variants) {
  const base = dynText("m_", tb.m) || pretty(tb.m);
  const sos = tb.v.endsWith("+sos");
  let vs = variants || [tb.v.replace("+sos", "")];
  vs = [...new Set(vs.filter(Boolean))];
  const parts = [];
  /* every season, or every time of day, with the same chance is written once */
  const all = (list, label) => { if (list.every(x => vs.includes(x))) { vs = vs.filter(x => !list.includes(x)); parts.push(t(label)); } };
  all(["spring", "summer", "autumn", "winter"], "v_allseasons");
  all(["morning", "day", "night"], "v_anytime");
  vs.forEach(v => parts.push(dynText("v_", v) || pretty(v)));
  if (sos) parts.push(dynText("v_", "sos"));
  return base + (parts.length ? " (" + parts.join(", ") + ")" : "");
}
function chanceText(m, tb) {
  const [, , , pmin, pmax, slots] = m;
  if (pmin !== null && pmin !== undefined) return (pmin === pmax ? pmin : pmin + "-" + pmax) + "%";
  return t("slotsOf", { n: slots, m: tb.n });
}
/* the rows of one place: [{ sp, lo, hi, tabs: [{ tb, m }] }], best chance first */
function placeRows(p) {
  const rows = new Map();
  for (const tb of p.tables) for (const m of tb.mons) {
    let r = rows.get(m[0]);
    if (!r) rows.set(m[0], r = { sp: m[0], lo: m[1], hi: m[2], tabs: [] });
    r.lo = Math.min(r.lo, m[1]); r.hi = Math.max(r.hi, m[2]); r.tabs.push({ tb, m });
  }
  const best = r => Math.max(...r.tabs.map(x => x.m[4] ?? -1));
  return [...rows.values()].sort((a, b) => best(b) - best(a) || a.sp - b.sp);
}
function wildChips(r) {
  /* tables that give the same chance and levels (the four seasons, the three times of day) are shown as one chip */
  const groups = new Map();
  for (const { tb, m } of r.tabs) {
    const key = [tb.m, chanceText(m, tb), m[1], m[2], tb.pg ? 1 : 0, tb.v.endsWith("+sos") ? 1 : 0, tb.v === "tod" ? 1 : 0].join("|");
    let g = groups.get(key);
    if (!g) groups.set(key, g = { tb, m, vs: [], maps: 0 });
    g.vs.push(tb.v.replace("+sos", "")); g.maps = Math.max(g.maps, tb.maps);
  }
  return [...groups.values()].map(({ tb, m, vs, maps }) => {
    const own = m[1] !== r.lo || m[2] !== r.hi;
    const tip = t("level") + lvText(m[1], m[2]) + (maps > 1 ? " - " + t("inMaps", { n: maps }) : "") + (tb.pg ? " - " + t("postGame") : "");
    return `<span class="way${tb.pg ? " pg" : ""}" title="${esc(tip)}"><b>${esc(methodLabel(tb, vs))}</b> ${esc(chanceText(m, tb))}${own ? ` <i>${esc(t("level"))}${lvText(m[1], m[2])}</i>` : ""}</span>`;
  }).join("");
}
function placeChanged(p, op) { return !op || !same(p.tables, op.tables); }
function renderWild() {
  if (!R.wild) return `<div class="view"><p class="muted">${esc(t("noData"))}</p></div>`;
  const q = norm(S.filter.wd);
  const keys = wildKeysR();
  const sortMode = S.filter.wdSort || "game";
  let unknownN = 0;
  let items = R.wild.map((p, i) => ({ p, i, key: keys[i], nth: p.tag === "UNKNOWN" ? ++unknownN : 0 }));
  items = items.filter(({ p, key, nth }) => {
    const op = wildOrig().get(key);
    if (S.changedOnly && !placeChanged(p, op)) return false;
    if (!q) return true;
    const names = new Set();
    p.tables.forEach(tb => tb.mons.forEach(m => names.add(norm(spName(m[0])))));
    const text = norm(placeName(p, nth) + " " + (p.tag || "") + " " + (PLACES[p.tag] || []).join(" ") + " " + [...names].join(" "));
    return text.includes(q);
  });
  if (sortMode === "name") items.sort((a, b) => placeName(a.p, a.nth).localeCompare(placeName(b.p, b.nth), S.lang));
  const limit = q ? 400 : (S.lim.wd || 120);
  let html = `<div class="bar">${searchBox("wd", t("searchWild"))}<select data-filter="wdSort" aria-label="${esc(t("sortBy"))}"><option value="game" ${sortMode === "game" ? "selected" : ""}>${esc(t("sortGame"))}</option><option value="name" ${sortMode === "name" ? "selected" : ""}>${esc(t("sortName"))}</option></select>${changedChip()}<span class="count">${num(items.length)} ${esc(t("places"))}</span></div>
    <p class="muted legend">${esc(t("wildLegend"))}</p>`;
  items.slice(0, limit).forEach(({ p, key, nth }) => {
    const op = wildOrig().get(key);
    const changed = placeChanged(p, op);
    const shownP = S.showOrig && op ? op : p;
    const rows = placeRows(shownP);
    const origSet = new Set(op ? op.tables.flatMap(tb => tb.mons.map(m => tableKey(tb) + ":" + m[0])) : []);
    const origRow = new Map(op ? placeRows(op).map(r => [r.sp, r]) : []);
    const body = rows.map(r => {
      const isNew = !S.showOrig && op && !r.tabs.some(({ tb, m }) => origSet.has(tableKey(tb) + ":" + m[0]));
      const or = origRow.get(r.sp);
      const lvChanged = !S.showOrig && op && or && (or.lo !== r.lo || or.hi !== r.hi);
      const sp = S.showOrig ? spName(r.sp, true) : spName(r.sp);
      return `<tr class="row"><td class="${isNew ? "changed" : ""}">${esc(sp)}${isNew ? ` <span class="pill cyan">${esc(t("newHere"))}</span>` : ""}</td>
        <td class="num${lvChanged ? " changed" : ""}">${lvText(r.lo, r.hi)}${lvChanged ? `<span class="was">${lvText(or.lo, or.hi)}</span>` : ""}</td><td class="ways"><div class="waylist">${wildChips(r)}</div></td></tr>`;
    }).join("");
    let gone = "";
    if (!S.showOrig && op) {
      const nowSet = new Set(rows.map(r => r.sp));
      const lost = placeRows(op).filter(r => !nowSet.has(r.sp)).map(r => spName(r.sp, true));
      if (lost.length) gone = `<p class="muted gone">${esc(t("wasHere"))}: <span class="was inline">${esc(lost.join(", "))}</span></p>`;
    }
    html += `<details class="card place" ${q ? "open" : ""}><summary><span class="ord" title="${esc(t("gameOrder"))}">#${p.n}</span><b>${esc(placeName(p, nth))}</b>${p.pg ? `<span class="pill">${esc(t("postGame"))}</span>` : ""}<span class="pill">${rows.length} ${esc(t("tabPokemon"))}</span>${changed ? `<span class="pill cyan">${esc(t("changedTag"))}</span>` : ""}</summary>
      <div class="tablewrap flat"><table><tr class="hd"><th scope="col">${esc(t("tabPokemon"))}</th><th scope="col" class="num">${esc(t("level"))}</th><th scope="col">${esc(t("ways"))}</th></tr>${body}</table></div>${gone}</details>`;
  });
  if (!items.length) html += `<p class="muted">${esc(t("noResults"))}</p>`;
  if (items.length > limit) html += `<p><button class="chip" type="button" data-more="wd">${esc(t("showMore"))} (${num(items.length - limit)})</button></p>`;
  return `<div class="view">${spoiler(html)}</div>`;
}

/* ---------- where to find a Pokemon ---------- */
function buildFindIndex() {
  /* id -> [{ n (game order), kind, text, ways }]; rebuilt on every draw because its labels follow the language */
  const idx = new Map(); const add = (id, e) => { if (!idx.has(id)) idx.set(id, []); idx.get(id).push(e); };
  (R.starters || []).forEach(id => add(id, { n: 0, kind: "starter", text: t("starter") }));
  let unknownN = 0;
  (R.wild || []).forEach(p => {
    const nth = p.tag === "UNKNOWN" ? ++unknownN : 0;
    for (const r of placeRows(p)) add(r.sp, { n: p.n, kind: "wild", text: placeName(p, nth), lv: lvText(r.lo, r.hi), ways: wildChips(r), pg: p.pg });
  });
  (R.statics || []).forEach(s => add(s.species, { n: s.n, kind: "static", text: `${s.egg ? t("egglbl") : t("staticLbl")} (${t("level")}${s.level})`, note: t("locNone") }));
  (R.trades || []).forEach(tr => add(tr.give, { n: tr.n, kind: "trade", text: t("tradeLine", { give: tr.want ? spName(tr.want) : t("anything"), get: spName(tr.give) }), note: t("locNone") }));
  return idx;
}
function renderFind() {
  const FIND = buildFindIndex();
  const q = norm(S.filter.fd);
  let html = `<div class="bar">${searchBox("fd", t("where"))}</div>`;
  if (!q) return `<div class="view">${spoiler(html + `<p class="muted">${esc(t("where"))}</p>`)}</div>`;
  const hits = (R.species || []).filter(s => norm(nm(s)).includes(q)).slice(0, 25);
  const kindOrder = { starter: 0, wild: 1, static: 2, trade: 3 };
  for (const s of hits) {
    const places = (FIND.get(s.id) || []).slice().sort((a, b) => kindOrder[a.kind] - kindOrder[b.kind] || a.n - b.n);
    html += `<div class="card"><h3>${esc(nm(s))} <span class="pill">#${s.id}</span></h3>`;
    if (!places.length) html += `<p class="muted">${esc(t("nowhere"))}</p>`;
    else html += `<ul class="finds">${places.map(p => `<li><span class="ord ordcol">${p.kind === "starter" ? "" : "#" + p.n}</span><div class="ftext"><div class="fhead"><b>${esc(p.text)}</b>${p.pg ? `<span class="pill">${esc(t("postGame"))}</span>` : ""}${p.lv ? `<span class="muted">${esc(t("level"))}${p.lv}</span>` : ""}${p.note ? `<span class="muted">${esc(p.note)}</span>` : ""}</div>${p.ways ? `<div class="waylist">${p.ways}</div>` : ""}</div></li>`).join("")}</ul>`;
    html += `</div>`;
  }
  if (!hits.length) html += `<p class="muted">${esc(t("noResults"))}</p>`;
  return `<div class="view">${spoiler(html)}</div>`;
}

    }).join("");
    html += `<details class="card place" ${q ? "open" : ""}><summary><span class="ord" title="${esc(t("gameOrder"))}">#${tr.n}</span>${tr.boss ? "&#9733; " : ""}<b>${esc(cleanName(tr.name))}</b>${tr.tag ? `<span class="pill">${esc(tagName(tr.tag))}</span>` : ""}<span class="pill">${esc(t("level"))}${o.lv}</span>${changed ? `<span class="pill cyan">${esc(t("changedTag"))}</span>` : ""}</summary>
      <div class="tablewrap flat"><table><tr class="hd"><th scope="col">${esc(t("party"))}</th><th scope="col" class="num">${esc(t("level"))}</th><th scope="col">${esc(t("tabMoves"))}</th><th scope="col">${esc(t("heldItem"))}</th></tr>${rows}</table></div></details>`;
  });
  if (!items.length) html += `<p class="muted">${esc(t("noResults"))}</p>`;
  if (items.length > limit) html += `<p><button class="chip" type="button" data-more="tn">${esc(t("showMore"))} (${num(items.length - limit)})</button></p>`;
  return `<div class="view">${spoiler(html)}</div>`;
}

function renderShops() {
  if (!R.shops) return `<div class="view"><p class="muted">${esc(t("noData"))}</p></div>`;
  const sortMode = S.filter.shSort || "game";
  let html = `<div class="bar"><select data-filter="shSort" aria-label="${esc(t("sortBy"))}"><option value="game" ${sortMode === "game" ? "selected" : ""}>${esc(t("sortGame"))}</option><option value="name" ${sortMode === "name" ? "selected" : ""}>${esc(t("sortName"))}</option></select>${changedChip()}</div><p class="muted legend">${esc(t("shopNote"))}</p>`;
  const items = R.shops.map((s, i) => ({ s, i }));
  if (sortMode === "name") items.sort((a, b) => shopName(a.s.name).localeCompare(shopName(b.s.name), S.lang));
  else items.sort((a, b) => a.s.n - b.s.n);
  items.forEach(({ s, i }) => {
    const o = (O.shops || [])[i] || s;
    if (S.changedOnly && same(s.items, o.items)) return;
    const chips = s.items.map(id => `<span class="tag ${o.items.includes(id) ? "" : "changed"}">${esc(itName(id))}</span>`).join("");
    html += `<div class="card"><div class="cardhead"><span class="ord">#${s.n}</span><b>${esc(shopName(s.name) || "#" + (i + 1))}</b><span class="pill">${esc(s.main ? t("shopMain") : t("shopOther"))}</span></div><div class="tags">${chips}</div></div>`;
  });
  return `<div class="view">${spoiler(html)}</div>`;
}

function hl(text, q) {
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + "<mark>" + esc(text.slice(i, i + q.length)) + "</mark>" + hl(text.slice(i + q.length), q);
}
function renderLog() {
  if (!DATA.log) return `<div class="view"><p class="muted">${esc(t("logEmpty"))}</p></div>`;
  const lines = logLines();
  const q = (S.filter.lg || "").trim().toLowerCase();
  const sections = [];
  lines.forEach((ln, i) => { const m = BANNER.exec(ln); if (m) sections.push([i, m[1], m[2]]); });
  let idxs = [];
  if (q) { for (let i = 0; i < lines.length && idxs.length < S.logLimit + 1; i++) if (lines[i].toLowerCase().includes(q)) idxs.push(i); }
  else { for (let i = S.logStart; i < Math.min(lines.length, S.logStart + S.logLimit); i++) idxs.push(i); }
  const more = q ? idxs.length > S.logLimit : S.logStart + S.logLimit < lines.length;
  if (q && more) idxs = idxs.slice(0, S.logLimit);
  const cls = ln => BANNER.test(ln) ? " banner" : /^\s*=+\s*$/.test(ln) ? " rule" : /warn|skipp|could not|cannot|not valid/i.test(ln) ? " warn" : "";
  const body = idxs.map(i => `<div class="ln${cls(lines[i])}" id="L${i}"><span class="no">${i + 1}</span><span>${hl(lines[i], q) || "&nbsp;"}</span></div>`).join("");
  const jump = `<select data-logjump aria-label="${esc(t("logJump"))}"><option value="">${esc(t("logJump"))}</option>${sections.map(([i, title, code]) => `<option value="${i}">${esc(title)} {${esc(code)}}</option>`).join("")}</select>`;
  return `<div class="view"><div class="note" style="margin-bottom:12px">${esc(t("logEnglishOnly"))}</div>
    <div class="bar">${searchBox("lg", t("logSearch"))}${jump}<button class="chip" type="button" id="btnLogDownload">${esc(t("logDownload"))}</button>
      <span class="count">${esc(t("logShown", { n: num(idxs.length), m: num(q ? idxs.length + (more ? 1 : 0) : lines.length) }))}${q && more ? "+" : ""}</span></div>
    <div class="logbox" id="logbox" role="region" tabindex="0" aria-label="${esc(t("tabLog"))}">${body || `<div class="ln"><span>${esc(t("logNoMatch"))}</span></div>`}</div>
    ${more ? `<p><button class="chip" type="button" id="btnLogMore">${esc(t("logMore"))}</button></p>` : ""}</div>`;
}

const RENDER = { ov: renderOverview, pk: renderPokemon, mv: renderMoves, wd: renderWild, fd: renderFind, st: renderStatics, tr: renderTrades, tn: renderTrainers, sh: renderShops, lg: renderLog };

/* ---------- shell: everything visible is (re)written here, so switching the language never needs a reload ---------- */
function paint() {
  document.documentElement.lang = S.lang;
  document.title = t("title") + " - " + (META.rom || "");
  document.getElementById("skip").textContent = t("skipLink");
  document.getElementById("gameName").textContent = META.rom || "";
  const seed = META.seed < 0 ? t("seedRandom") : META.seed;
  document.getElementById("chips").innerHTML =
    (META.version ? `<span class="pill cyan">${esc(t("version"))} ${esc(META.version)}</span>` : "") +
    `<span class="pill">${esc(t("seed"))} <span class="mono">${esc(seed)}</span></span><span class="pill">${esc(META.date || "")}</span>`;
  const hide = document.body.classList.contains("hide");
  const spoil = document.getElementById("btnSpoil");
  spoil.setAttribute("aria-pressed", String(hide));
  document.getElementById("spoilLabel").textContent = t("spoilersLabel");
  const orig = document.getElementById("btnOrig");
  orig.setAttribute("aria-pressed", String(S.showOrig));
  document.getElementById("origLabel").textContent = t("showOrig");
  document.getElementById("langSeg").setAttribute("aria-label", t("langLabel"));
  document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  const th = document.getElementById("btnTheme"); th.title = t("themeTip"); th.setAttribute("aria-label", t("themeTip"));
  const tabsEl = document.getElementById("tabs");
  tabsEl.setAttribute("aria-label", t("sectionsLabel"));
  tabsEl.innerHTML = `<div class="label">${esc(t("sectionsLabel"))}</div>` + TABS.map(([id, key]) => {
    const n = tabCount(id);
    return `<button type="button" data-tab="${id}" ${S.tab === id ? 'aria-current="page"' : ""}><span class="t">${esc(t(key))}</span>${n === null ? "" : `<span class="n${n ? " has" : ""}">${num(n)}</span>`}</button>`;
  }).join("");
  const active = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.filter : null;
  const pos = active ? document.activeElement.selectionStart : 0;
  const view = document.getElementById("view");
  const keepScroll = view.querySelector(".tablewrap") ? view.querySelector(".tablewrap").scrollTop : 0;
  view.innerHTML = RENDER[S.tab]();
  const wrap = view.querySelector(".tablewrap"); if (wrap && keepScroll) wrap.scrollTop = keepScroll;
  document.getElementById("foot").textContent = t("footer");
  if (active) { const el = document.querySelector(`[data-filter="${active}"]`); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
}
function goTab(id) { S.tab = id; paint(); window.scrollTo({ top: 0 }); }

document.addEventListener("click", ev => {
  const el = ev.target.closest("button, [data-reveal]"); if (!el) return;
  if (el.hasAttribute("data-reveal")) { S.revealed[S.tab] = true; el.closest(".spoiler").classList.add("revealed"); return; }
  if (el.dataset.tab) { goTab(el.dataset.tab); return; }
  if (el.dataset.sort) { const [k, c] = el.dataset.sort.split(":"); const s = S.sort[k]; S.sort[k] = { col: c, dir: s && s.col === c ? -s.dir : 1 }; paint(); return; }
  if (el.dataset.more) { S.lim[el.dataset.more] = (S.lim[el.dataset.more] || 120) + 200; paint(); return; }
  if (el.id === "btnBosses") { S.filter.tnBoss = !S.filter.tnBoss; paint(); return; }
  if (el.dataset.open) { S.open[el.dataset.open] = !S.open[el.dataset.open]; paint(); return; }
  if (el.id === "btnSpoil") { document.body.classList.toggle("hide"); paint(); return; }
  if (el.id === "btnOrig") { S.showOrig = !S.showOrig; paint(); return; }
  if (el.id === "btnChanged") { S.changedOnly = !S.changedOnly; paint(); return; }
  if (el.dataset.lang) { S.lang = el.dataset.lang; try { localStorage.setItem("guideLang", S.lang); } catch (e) {} paint(); return; }
  if (el.id === "btnLogMore") { S.logLimit += 1500; paint(); return; }
  if (el.id === "btnLogDownload") {
    const blob = new Blob(["﻿" + String(DATA.log || "")], { type: "text/plain;charset=utf-8" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (META.rom || "randomization").replace(/[^A-Za-z0-9._-]+/g, "_") + ".log";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); return;
  }
  if (el.id === "btnTheme") {
    const cur = document.documentElement.dataset.theme; const next = cur === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = next; try { localStorage.setItem("guideTheme", next); } catch (e) {} return;
  }
});
document.addEventListener("input", ev => {
  const k = ev.target.dataset && ev.target.dataset.filter; if (!k) return;
  S.filter[k] = ev.target.value; if (k === "lg") { S.logLimit = 1200; S.logStart = 0; } paint();
});
document.addEventListener("change", ev => {
  if (ev.target.dataset && "logjump" in ev.target.dataset) {
    const i = parseInt(ev.target.value, 10); if (isNaN(i)) return;
    S.filter.lg = ""; S.logStart = i; S.logLimit = 1200; paint(); return;
  }
  const k = ev.target.dataset && ev.target.dataset.filter; if (!k || ev.target.tagName !== "SELECT") return;
  S.filter[k] = ev.target.value; paint();
});
/* A link like guide.html#pk,show opens the Pokemon tab with spoilers shown; ",es" or ",en" picks the language,
   ",light" or ",dark" the theme. */
try {
  const h = location.hash.slice(1).split(",");
  if (TABS.some(([id]) => id === h[0])) S.tab = h[0];
  if (h.includes("show")) document.body.classList.remove("hide");
  if (h.includes("es")) S.lang = "es"; else if (h.includes("en")) S.lang = "en";
  if (h.includes("light")) document.documentElement.dataset.theme = "light"; else if (h.includes("dark")) document.documentElement.dataset.theme = "dark";
} catch (e) {}
paint();
</script>
